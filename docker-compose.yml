version: "3.9"

services:
  redis:
    image: redis/redis-stack:7.2.0-v9
    container_name: onprem-rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - REDIS_ARGS=--save 60 1 --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rag-internal

  cpu-slm:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: onprem-rag-slm
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - ./models/slm_gguf:/models:ro
    environment:
      - LLAMA_ARG_MODEL=/models/qwen2.5-3b-instruct-q4_k_m.gguf
      - LLAMA_ARG_CTX_SIZE=32768
      - LLAMA_ARG_N_THREADS=16
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
    cpus: 16.0
    mem_limit: 16g
    networks:
      - rag-internal

  vllm:
    image: vllm/vllm-openai:latest
    container_name: onprem-rag-vllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./models/llm_7b:/models/llm_7b:ro
    environment:
      - MODEL=/models/llm_7b/qwen2.5-7b-instruct
      - HOST=0.0.0.0
      - PORT=8000
      - MAX_MODEL_LEN=8192
      - GPU_MEMORY_UTILIZATION=0.90
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - rag-internal

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onprem-rag-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs:ro
      - ./gateway:/app/gateway:ro
      - ./models:/app/models:ro
      - ./askiisc_chat:/app/askiisc_chat:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rag-internal

networks:
  rag-internal:
    driver: bridge

volumes:
  redis_data:
    driver: local
