# ==============================================================================
# AskIISc Tier-1 CPU Small Language Model (SLM) Configuration
# ==============================================================================

model:
  name: "models/slm_gguf/qwen2.5-3b-instruct-q4_k_m.gguf"
  shm_path: "/dev/shm/models/qwen2.5-3b-instruct-q4_k_m.gguf"
  fallback_name: "Qwen/Qwen2.5-3B-Instruct"
  architecture: "qwen2.5"
  dtype: "q4_k_m"                                 # 4-bit medium K-quantization for fast CPU GEMM
  context_window_tokens: 32768
  max_new_tokens: 512                             # Generation token ceiling per query
  default_temperature: 0.1
  top_p: 0.9

retrieval:
  top_k_chunks: 3                                 # Dynamic chunks filtered and fed to SLM context
  max_k_ceiling: 5
  similarity_floor: 0.20                          # Absolute distance cut-off
  relative_margin: 0.15

cpu_affinity:
  workers: 6                                      # 6 parallel SLM workers
  num_threads: 16                                 # 16 PyTorch threads per worker (6 x 16 = 96 threads across workers)
  num_threads_batch: 32                           # Prefill batch matrix multiplication thread allocation
  omp_wait_policy: "PASSIVE"
  numa_node: 0

runtime:
  engine: "gguf"
  host: "127.0.0.1"
  port: 8082
  streaming: true                                 # SSE token streaming support

sanitization:
  fenced_prompt: true                             # Enclose user queries in fenced delimiters
  context_xml_escape: true                        # Escape delimiter breakouts in indexed document text
