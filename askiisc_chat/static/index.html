<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AskIISc · Institutional Thesis Q&amp;A</title>
  <link rel="stylesheet" href="/static/vendor/katex.min.css">
  <script src="/static/vendor/katex.min.js"></script>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <style>
    :root {
      --bg: #fafaf8;
      --fg: #1c1c1a;
      --mut: #6b6b66;
      --card: #ffffff;
      --bd: #e3e2dc;
      --ac: #7a1f2b;
      --ac-hover: #942735;
      --slm: #2b6e4f;
      --llm: #7a1f2b;
      --cache: #4a5568;
      --code-bg: #f4f3ef;
      --border-radius: 12px;
    }
    @media(prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --fg: #ececea;
        --mut: #9a9a94;
        --card: #1e1e1d;
        --bd: #30302c;
        --ac: #d98a96;
        --ac-hover: #e8a0ab;
        --slm: #6fcf9f;
        --llm: #e5949f;
        --cache: #a0aec0;
        --code-bg: #282826;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--bd);
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--card);
    }
    header h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      margin-right: auto;
      letter-spacing: -0.01em;
    }
    select, button, textarea {
      font: inherit;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 6px 12px;
    }
    #chat {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      padding: 14px 18px;
      border-radius: var(--border-radius);
      border: 1px solid var(--bd);
      background: var(--card);
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.6;
    }
    .msg p { margin: 0 0 10px 0; }
    .msg p:last-child { margin-bottom: 0; }
    .msg h1, .msg h2, .msg h3, .msg h4 {
      margin: 14px 0 8px 0;
      font-weight: 600;
      line-height: 1.3;
    }
    .msg h1 { font-size: 1.3em; }
    .msg h2 { font-size: 1.2em; }
    .msg h3 { font-size: 1.1em; }
    .msg ul, .msg ol {
      margin: 8px 0 10px 20px;
      padding: 0;
    }
    .msg li { margin-bottom: 4px; }
    .msg code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9em;
      background: var(--code-bg);
      padding: 2px 5px;
      border-radius: 4px;
    }
    .msg pre {
      background: var(--code-bg);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .msg pre code {
      background: transparent;
      padding: 0;
    }
    .msg blockquote {
      margin: 10px 0;
      padding-left: 12px;
      border-left: 3px solid var(--ac);
      color: var(--mut);
    }
    .user {
      align-self: flex-end;
      background: var(--ac);
      color: #ffffff;
      border-color: transparent;
      max-width: 82%;
      white-space: pre-wrap;
    }
    .user p { margin: 0; }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid currentColor;
      margin: 0 6px 8px 0;
    }
    .slm { color: var(--slm); }
    .llm { color: var(--llm); }
    .cache { color: var(--cache); }
    .regen { color: var(--ac); }
    .cache-note { margin: -4px 0 8px 0; font-style: italic; }
    .regen-btn {
      background: transparent;
      border: 1px solid var(--bd);
      color: var(--ac);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 8px;
      cursor: pointer;
    }
    .regen-btn:hover { border-color: var(--ac); }
    .regen-btn:disabled { opacity: 0.6; cursor: wait; }
    .note { color: var(--mut); font-size: 12px; margin-top: 8px; }
    details {
      margin-top: 10px;
      font-size: 13px;
      color: var(--mut);
      border-top: 1px dashed var(--bd);
      padding-top: 8px;
    }
    details summary {
      cursor: pointer;
      font-weight: 500;
      user-select: none;
    }
    details summary:hover { color: var(--fg); }
    details div.citation-card {
      margin: 8px 0;
      padding: 8px 10px;
      background: var(--code-bg);
      border-radius: 6px;
      white-space: pre-wrap;
    }
    form {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--bd);
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      background: var(--bg);
    }
    textarea {
      flex: 1;
      resize: none;
      height: 48px;
      line-height: 1.4;
      border-radius: 10px;
      padding: 8px 12px;
    }
    button.send-btn {
      background: var(--ac);
      color: #ffffff;
      border: 0;
      border-radius: 10px;
      padding: 0 22px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button.send-btn:hover { background: var(--ac-hover); }
    button.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #gate {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #gate .box {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 32px;
      width: min(420px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    #gate h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
    #gate input {
      font: inherit;
      color: inherit;
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 10px 12px;
    }
    #gate button {
      padding: 10px;
      background: var(--ac);
      color: #fff;
      border: 0;
      font-weight: 500;
      cursor: pointer;
    }
    #gate button:hover { background: var(--ac-hover); }
    #gate button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
      vertical-align: -2px;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #resend-btn {
      transition: opacity 0.2s;
    }
    #resend-btn:disabled {
      color: var(--mut) !important;
      cursor: not-allowed !important;
      opacity: 0.6;
    }
    #resend-btn:not(:disabled):hover {
      text-decoration: underline !important;
    }
    #gate .err {
      font-size: 13px;
      min-height: 18px;
      line-height: 1.4;
    }
    /* KaTeX Mathematical display equations */
    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px 0;
      margin: 12px 0;
    }
    .katex {
      font-size: 1.05em;
    }
  </style>
</head>
<body>
  <header>
    <h1>AskIISc · thesis Q&amp;A</h1>
    <label id="lbl-thesis" style="display:none">Thesis <select id="thesis"><option value="">all theses</option></select></label>
    <label id="lbl-force" style="display:none">Model <select id="force"><option value="">auto (router)</option><option value="slm">force SLM</option><option value="llm">force 7B</option></select></label>
    <span id="who" class="note"></span>
    <button id="clear" type="button" style="display:none;background:var(--card);color:var(--fg);border:1px solid var(--bd);padding:6px 14px">New chat</button>
  </header>

  <div id="gate">
    <div class="box">
      <h2>Sign in to AskIISc</h2>
      <div id="gate-note" class="note">Enter your IISc email address. A 6-digit verification code will be sent to your inbox.</div>
      <div id="step1" style="display:flex;flex-direction:column;gap:12px">
        <input id="em" type="email" autocomplete="email" placeholder="name@iisc.ac.in">
        <button id="gen" type="button">Generate OTP</button>
      </div>
      <div id="step2" style="display:none;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px">
          <span>Code sent to <b id="target-email" style="color:var(--fg)"></b></span>
          <a href="#" id="change-em" style="color:var(--ac);text-decoration:underline">Change email</a>
        </div>
        <input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code">
        <button id="ver" type="button">Verify &amp; continue</button>
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-top:2px">
          <span>Didn't receive code?</span>
          <button id="resend-btn" type="button" disabled style="background:transparent;border:0;color:var(--ac);font-weight:600;padding:4px 6px;cursor:pointer">Resend OTP (60s)</button>
        </div>
      </div>
      <div class="err" id="gerr"></div>
    </div>
  </div>

  <main id="chat">
    <div id="log"></div>
    <form id="f">
      <textarea id="q" placeholder="Ask about research, methods, or equations in IISc theses… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
      <button id="go" class="send-btn">Send</button>
    </form>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
