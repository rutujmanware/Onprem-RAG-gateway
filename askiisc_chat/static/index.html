<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AskIISc · Institutional Thesis Q&amp;A</title>
  <link rel="stylesheet" href="/static/vendor/katex.min.css">
  <script src="/static/vendor/katex.min.js"></script>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;   /* scrollbars and form controls follow the theme */
      --bg: #ffffff;
      --side: #f9f9f8;
      --fg: #0d0d0d;
      --mut: #6b6b6b;
      --bd: #e6e6e3;
      --hover: #ececea;
      --bubble: #f2f2f0;
      --composer: #ffffff;
      --code-bg: #f5f5f3;
      --ac: #7a1f2b;
      --ac-hover: #942735;
      --send-bg: #0d0d0d;
      --send-fg: #ffffff;
      --slm: #2b6e4f;
      --llm: #7a1f2b;
      --cache: #4a5568;
      --err: #c0392b;
      --ok: #2b6e4f;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #212121;
        --side: #171717;
        --fg: #ececec;
        --mut: #a3a3a3;
        --bd: #363636;
        --hover: #2c2c2c;
        --bubble: #303030;
        --composer: #303030;
        --code-bg: #2a2a2a;
        --ac: #e5949f;
        --ac-hover: #f0aab3;
        --send-bg: #ececec;
        --send-fg: #0d0d0d;
        --slm: #6fcf9f;
        --llm: #e5949f;
        --cache: #a0aec0;
        --err: #ff8a80;
        --ok: #6fcf9f;
        --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    button, select, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .ic { display: inline-grid; place-items: center; line-height: 0; }

    /* ---------------- Sidebar ---------------- */
    #side {
      width: 260px;
      flex: none;
      display: flex;
      flex-direction: column;
      background: var(--side);
      border-right: 1px solid var(--bd);
      transition: margin-left 0.2s ease, transform 0.2s ease;
    }
    body.side-closed #side { margin-left: -260px; }
    .side-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 10px 4px 14px;
      height: 52px;
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; }
    .brand-mark {
      width: 26px; height: 26px;
      border-radius: 7px;
      background: var(--ac);
      color: var(--bg);
      display: grid; place-items: center;
      font-size: 14px; font-weight: 700;
    }
    .icon-btn {
      background: transparent;
      border: 0;
      color: var(--mut);
      padding: 7px;
      border-radius: 8px;
      display: inline-grid;
      place-items: center;
    }
    .icon-btn:hover { background: var(--hover); color: var(--fg); }
    #new {
      display: flex; align-items: center; gap: 10px;
      margin: 6px 8px 0;
      padding: 9px 10px;
      border: 0; border-radius: 10px;
      background: transparent;
      text-align: left;
    }
    #new:hover { background: var(--hover); }
    .hist-label { font-size: 12px; color: var(--mut); font-weight: 500; padding: 18px 18px 6px; margin: 0; }
    #hist { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
    .hist-item {
      display: flex; align-items: center; gap: 4px;
      padding: 0 4px 0 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .hist-item:hover, .hist-item.active { background: var(--hover); }
    .hist-item .t { flex: 1; min-width: 0; padding: 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-item .del { visibility: hidden; padding: 5px; }
    .hist-item:hover .del, .hist-item.active .del, .hist-item:focus-within .del { visibility: visible; }
    .side-foot {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
      border-top: 1px solid var(--bd);
      font-size: 13px;
    }
    .me-avatar {
      width: 30px; height: 30px; flex: none;
      border-radius: 50%;
      background: var(--bubble);
      display: grid; place-items: center;
      font-weight: 600; font-size: 13px; text-transform: uppercase;
    }
    #who { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--mut); }
    #signout { background: transparent; border: 0; color: var(--mut); padding: 4px 6px; border-radius: 6px; font-size: 13px; }
    #signout:hover { background: var(--hover); color: var(--fg); }
    #scrim { display: none; }

    /* ---------------- Main column ---------------- */
    #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    #top { height: 52px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
    .top-title { font-weight: 600; font-size: 16px; margin: 0 6px 0 4px; }
    #top label { font-size: 13px; color: var(--mut); }
    #top select { background: var(--bg); border: 1px solid var(--bd); border-radius: 8px; padding: 4px 8px; margin-left: 4px; }
    .spacer { flex: 1; }
    #new-top { display: none; }
    body.side-closed #new-top { display: inline-grid; }
    body:not(.side-closed) #menu-open-title,
    body:not(.side-closed) #menu { display: none; }

    #chat { flex: 1; min-height: 0; display: none; flex-direction: column; }
    #scroll { flex: 1; overflow-y: auto; }
    #scroll, #hist { scrollbar-width: thin; scrollbar-color: var(--bd) transparent; }
    #log {
      max-width: 780px;
      margin: 0 auto;
      padding: 16px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }
    #dock { width: 100%; max-width: 780px; margin: 0 auto; padding: 0 20px 10px; }
    #empty { display: none; text-align: center; margin-bottom: 22px; }
    #empty h2 { font-size: 28px; font-weight: 600; margin: 0 0 18px; letter-spacing: -0.01em; }
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .chip {
      background: transparent;
      border: 1px solid var(--bd);
      border-radius: 99px;
      padding: 7px 14px;
      font-size: 13.5px;
      color: var(--mut);
    }
    .chip:hover { background: var(--hover); color: var(--fg); }
    #chat.empty { justify-content: center; padding-bottom: 12vh; }
    #chat.empty #scroll { display: none; }
    #chat.empty #empty { display: block; }

    /* ---------------- Composer ---------------- */
    #f {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--composer);
      border: 1px solid var(--bd);
      border-radius: 26px;
      padding: 8px 8px 8px 20px;
      box-shadow: var(--shadow);
    }
    #f:focus-within { border-color: var(--mut); }
    #q {
      flex: 1;
      border: 0;
      outline: none;
      background: transparent;
      resize: none;
      height: 40px;
      max-height: 200px;
      padding: 8px 0;
      line-height: 1.5;
    }
    #go {
      width: 38px; height: 38px; flex: none;
      border: 0; border-radius: 50%;
      background: var(--send-bg);
      color: var(--send-fg);
      display: grid; place-items: center;
      transition: opacity 0.15s ease;
    }
    #go:disabled { opacity: 0.25; cursor: default; }
    .disclaimer { text-align: center; font-size: 12px; color: var(--mut); margin: 8px 0 0; }

    /* ---------------- Messages ---------------- */
    .turn.user { display: flex; justify-content: flex-end; }
    .bubble {
      background: var(--bubble);
      border-radius: 20px;
      padding: 9px 16px;
      max-width: 75%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .turn.bot { display: flex; gap: 14px; align-items: flex-start; }
    .avatar {
      width: 30px; height: 30px; flex: none;
      border-radius: 50%;
      border: 1px solid var(--bd);
      color: var(--ac);
      display: grid; place-items: center;
      font-weight: 700; font-size: 13px;
      margin-top: 1px;
    }
    .msg { flex: 1; min-width: 0; overflow-wrap: break-word; line-height: 1.65; }
    .msg .head:empty { display: none; }
    .msg p { margin: 0 0 12px 0; }
    .msg p:last-child { margin-bottom: 0; }
    .msg h1, .msg h2, .msg h3, .msg h4 { margin: 18px 0 8px; font-weight: 600; line-height: 1.3; }
    .msg h1 { font-size: 1.3em; }
    .msg h2 { font-size: 1.2em; }
    .msg h3 { font-size: 1.1em; }
    .msg ul, .msg ol { margin: 8px 0 12px 22px; padding: 0; }
    .msg li { margin-bottom: 4px; }
    .msg a { color: var(--ac); }
    .msg code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88em;
      background: var(--code-bg);
      padding: 2px 5px;
      border-radius: 5px;
    }
    .msg pre { background: var(--code-bg); padding: 12px 14px; border-radius: 10px; overflow-x: auto; margin: 10px 0; }
    .msg pre code { background: transparent; padding: 0; }
    .msg blockquote { margin: 10px 0; padding-left: 12px; border-left: 3px solid var(--bd); color: var(--mut); }
    .msg table { border-collapse: collapse; margin: 10px 0; display: block; overflow-x: auto; }
    .msg th, .msg td { border: 1px solid var(--bd); padding: 6px 10px; text-align: left; }
    .err { color: var(--err); }
    .badge {
      display: inline-block;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em;
      padding: 1px 8px;
      border-radius: 99px;
      border: 1px solid currentColor;
      margin: 0 6px 8px 0;
    }
    .slm { color: var(--slm); }
    .llm { color: var(--llm); }
    .cache { color: var(--cache); }
    .regen { color: var(--ac); }
    .dbg { color: var(--mut); }
    .note { color: var(--mut); font-size: 12.5px; }
    .note:empty { display: none; }
    .cache-note, .fix-note { margin: -2px 0 8px; font-style: italic; }
    .foot { margin-top: 8px; }
    .actions { display: flex; align-items: center; gap: 2px; margin: 6px 0 0 -7px; }
    .actions:empty { display: none; }
    .regen-btn {
      background: transparent;
      border: 1px solid var(--bd);
      color: var(--fg);
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 12.5px;
      margin-left: 6px;
    }
    .regen-btn:hover { background: var(--hover); }
    .regen-btn:disabled { opacity: 0.6; cursor: wait; }
    details.sources { margin-top: 12px; font-size: 13px; color: var(--mut); }
    details.sources summary {
      cursor: pointer; user-select: none;
      display: inline-block;
      padding: 3px 12px;
      border: 1px solid var(--bd);
      border-radius: 99px;
      font-weight: 500;
      list-style: none;
    }
    details.sources summary::-webkit-details-marker { display: none; }
    details.sources summary:hover { background: var(--hover); color: var(--fg); }
    .citation-card {
      margin: 8px 0;
      padding: 9px 12px;
      background: var(--code-bg);
      border-radius: 10px;
      white-space: pre-wrap;
    }
    .dots { display: inline-flex; gap: 4px; padding: 8px 0; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--mut); animation: blink 1.2s infinite ease-in-out; }
    .dots i:nth-child(2) { animation-delay: 0.15s; }
    .dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    /* ---------------- Sign-in gate ---------------- */
    #gate {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    #gate .box { width: min(380px, 100%); display: flex; flex-direction: column; gap: 14px; }
    #gate .brand-mark { width: 44px; height: 44px; font-size: 22px; border-radius: 12px; margin: 0 auto 6px; }
    #gate h2 { margin: 0; font-size: 26px; font-weight: 600; text-align: center; letter-spacing: -0.01em; }
    #gate-note { text-align: center; font-size: 14px; color: var(--mut); margin-bottom: 6px; }
    #gate input {
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
    }
    #gate input:focus { border-color: var(--ac); }
    #gate .primary {
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: var(--send-bg);
      color: var(--send-fg);
      font-weight: 500;
    }
    #gate .primary:hover { opacity: 0.88; }
    #gate .primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--mut); }
    #change-em { color: var(--ac); }
    #resend-btn { background: transparent; border: 0; color: var(--ac); font-weight: 600; padding: 4px 6px; }
    #resend-btn:disabled { color: var(--mut); cursor: not-allowed; opacity: 0.6; }
    #resend-btn:not(:disabled):hover { text-decoration: underline; }
    #gate .err-line { font-size: 13px; min-height: 18px; line-height: 1.4; text-align: center; }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: -2px;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 8px 0; margin: 12px 0; }
    .katex { font-size: 1.05em; }

    /* ---------------- Phones ---------------- */
    @media (max-width: 767px) {
      #side {
        position: fixed; top: 0; bottom: 0; left: 0;
        z-index: 50;
        margin-left: 0 !important;
        transform: translateX(-100%);
      }
      body.side-open #side { transform: none; box-shadow: var(--shadow); }
      body.side-open #scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 40; }
      #new-top, body #menu { display: inline-grid !important; }
      body #menu-open-title { display: inline !important; }
      #log, #dock { padding-left: 14px; padding-right: 14px; }
      .bubble { max-width: 88%; }
      .turn.bot { gap: 10px; }
      #empty h2 { font-size: 23px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #side, .dots i, .spinner { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <aside id="side" aria-label="Chats">
    <div class="side-top">
      <div class="brand"><span class="brand-mark">A</span>AskIISc</div>
      <button id="menu-close" class="icon-btn" type="button" title="Close sidebar" aria-label="Close sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <button id="new" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      New chat
    </button>
    <p id="hist-label" class="hist-label" hidden>Recent</p>
    <nav id="hist"></nav>
    <div class="side-foot">
      <span id="me-avatar" class="me-avatar">?</span>
      <span id="who"></span>
      <button id="signout" type="button" hidden>Sign out</button>
    </div>
  </aside>
  <div id="scrim"></div>

  <div id="main">
    <header id="top">
      <button id="menu" class="icon-btn" type="button" title="Sidebar" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <span id="menu-open-title" class="top-title">AskIISc</span>
      <span class="spacer"></span>
      <label id="lbl-thesis" hidden>Thesis <select id="thesis"><option value="">all theses</option></select></label>
      <label id="lbl-force" hidden>Model <select id="force"><option value="">auto (router)</option><option value="slm">force SLM</option><option value="llm">force 7B</option></select></label>
      <button id="new-top" class="icon-btn" type="button" title="New chat" aria-label="New chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </header>

    <main id="chat" class="empty">
      <div id="scroll"><div id="log" aria-live="polite"></div></div>
      <div id="dock">
        <div id="empty">
          <h2>What would you like to know?</h2>
          <div class="chips">
            <button class="chip" type="button" data-q="Summarise IISc research on lithium-ion battery anodes">Battery anodes</button>
            <button class="chip" type="button" data-q="Which methods do IISc theses use for protein structure prediction?">Protein structure</button>
            <button class="chip" type="button" data-q="Explain the governing equations used in IISc theses on turbulent flows">Turbulence equations</button>
            <button class="chip" type="button" data-q="What work has IISc done on wireless sensor networks?">Sensor networks</button>
          </div>
        </div>
        <form id="f">
          <textarea id="q" rows="1" placeholder="Ask about IISc theses" aria-label="Your question" autofocus></textarea>
          <button id="go" type="submit" aria-label="Send" title="Send" disabled></button>
        </form>
        <p class="disclaimer">Answers come from IISc theses and can be wrong. Check the sources.</p>
      </div>
    </main>
  </div>

  <div id="gate">
    <div class="box">
      <span class="brand-mark">A</span>
      <h2>Sign in to AskIISc</h2>
      <div id="gate-note">Use your IISc email. We'll send you a 6-digit code.</div>
      <div id="step1" style="display:flex;flex-direction:column;gap:12px">
        <input id="em" type="email" autocomplete="email" placeholder="name@iisc.ac.in">
        <button id="gen" class="primary" type="button">Send code</button>
      </div>
      <div id="step2" style="display:none;flex-direction:column;gap:12px">
        <div class="row">
          <span>Code sent to <b id="target-email" style="color:var(--fg)"></b></span>
          <a href="#" id="change-em">Change</a>
        </div>
        <input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code">
        <button id="ver" class="primary" type="button">Verify &amp; continue</button>
        <div class="row">
          <span>Didn't get it?</span>
          <button id="resend-btn" type="button" disabled>Resend code (60s)</button>
        </div>
      </div>
      <div class="err-line" id="gerr"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
